<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

    
  <!-- Favicons -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">


  <title>
    {% if page.title and page.title != site.title %}
      {{ page.title }} | {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <meta name="description" content="{{ page.description | default: site.description | escape }}">

  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">

  <!-- Shared site styles -->
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">

  <!-- Optional page-specific styles -->
  {% if page.extra_css %}
    <link rel="stylesheet" href="{{ page.extra_css | relative_url }}">
  {% endif %}
</head>

<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>

  {% include header.html %}

  <main id="main-content">
    {{ content }}
  </main>

  {% include footer.html %}

</body>
</html>
